<style>
:root{
  --void:#070807; --panel:#0D100E; --panel2:#141814; --panel3:#1A201C;
  --line:#1D231F; --line2:#2B342E;
  --green:#1E6F4A; --greenDim:#0F2A1C; --greenTxt:#4FBF8B;
  --gold:#C9A227; --goldDim:#3A3014; --goldSoft:#CFC7A8;
  --text:#E9EBE8; --dim:#7B847E; --dimmer:#4A524C; --red:#B4544A; --redDim:#331A17;
  --sans:'Manrope',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--void);height:100%;overscroll-behavior:none}
body{font-family:var(--sans);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;padding:0;font-size:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chead,.day,.tick,.chip,.act,.rbtn,.gitem>button{-webkit-user-select:none;user-select:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;max-width:540px;margin:0 auto;background:var(--void)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

header{border-bottom:1px solid var(--line);flex:none}
.hrow{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 9px;gap:10px}
.mark{font-size:15px;font-weight:700;letter-spacing:.14em}
.mark span{color:var(--gold)}
.hright{display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;padding:0;border:none;border-radius:50%;background:var(--dimmer);transition:.3s}
.dot.save{background:var(--gold)}
.dot.ok{background:var(--green)}
.dot.err{background:var(--red)}
.help{width:22px;height:22px;border:1px solid var(--line2);border-radius:50%;color:var(--dim);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none}
.days{display:flex;gap:4px;padding:0 12px 10px}
.day{flex:1;padding:9px 0 8px;border-radius:7px;text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--dim);background:var(--panel);border:1px solid transparent;transition:.15s;position:relative}
.day.on{background:var(--greenDim);border-color:var(--green);color:var(--text)}
.day i{display:block;height:3px;margin-top:4px;border-radius:2px;background:transparent}
.day.hecho i{background:var(--green)}
.day.hoy i{background:var(--gold)}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 12px 28px}

.banner{border:1px solid var(--goldDim);background:#15110A;border-radius:10px;padding:12px 13px;margin-bottom:14px}
.banner .eyebrow{color:var(--gold)}
.banner p{margin:5px 0 0;font-size:13px;color:var(--goldSoft);line-height:1.5}
.banner button{margin-top:9px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}

.daytitle{margin:2px 0 15px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.daytitle h1{font-size:21px;font-weight:700;margin:3px 0 0;letter-spacing:-.015em}
.prog{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right;flex:none}
.prog b{display:block;font-size:19px;color:var(--gold);font-weight:400;letter-spacing:-.02em}

.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.card.fisio{border-color:#1A4A34}
.card.full{border-color:var(--line2)}
.chead{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;width:100%;text-align:left}
.num{font-family:var(--mono);font-size:11px;color:var(--dimmer);padding-top:3px;min-width:17px}
.ctitle{flex:1;min-width:0}
.ctitle h2{font-size:15.5px;font-weight:500;margin:0;letter-spacing:-.01em;line-height:1.3}
.meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.02em}
.meta b{color:var(--greenTxt);font-weight:400}
.caret{color:var(--dimmer);font-size:11px;padding-top:4px;transition:.2s;flex:none}
.card.open .caret{transform:rotate(90deg)}
.done{width:16px;height:16px;border-radius:50%;background:var(--greenDim);border:1px solid var(--green);color:var(--greenTxt);font-size:9px;display:flex;align-items:center;justify-content:center;margin-top:3px;flex:none}
.body{display:none;padding:0 14px 13px;border-top:1px solid var(--line)}
.card.open .body{display:block}

.guide{background:var(--panel2);border-radius:8px;padding:10px 11px;margin:11px 0 10px}
.guide .eyebrow{color:var(--dim)}
.guide .v{font-family:var(--mono);font-size:14.5px;color:var(--gold);letter-spacing:.03em;margin-top:5px;display:block}
.guide .s{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.guide.first .v{color:var(--text);font-size:13px}

.setrow{display:flex;align-items:center;gap:6px;padding:5px 0 5px 8px;margin-left:-8px;border-left:2px solid transparent;border-radius:2px;transition:border-color .2s}
.setrow .stepper input{color:var(--dimmer)}
.setrow .stepper{border-style:dashed}
.setrow.hecha{border-left-color:var(--green)}
.setrow.hecha .stepper{background:var(--panel3);border-color:var(--line2);border-style:solid}
.setrow.hecha .stepper input{color:var(--text)}
.setrow.hecha .stepper .u{color:var(--dim)}
.setrow.pr .sn{color:var(--gold);font-weight:500}
.hoyl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:2px 0 3px}
.hoyl .hint{font-size:11.5px;color:var(--dimmer);text-align:right}
.hoyl b{color:var(--greenTxt);font-weight:400}
.sn{font-family:var(--mono);font-size:11px;color:var(--dimmer);width:14px;flex:none}
.stepper{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:7px;flex:1;min-width:0}
.stepper button{width:36px;height:42px;color:var(--dim);font-size:18px;line-height:1;flex:none}
.stepper button:active{color:var(--gold);background:var(--panel3)}
.stepper input{width:100%;min-width:0;text-align:center;background:none;border:none;font-family:var(--mono);font-size:16px;padding:0}
.stepper input::placeholder{color:var(--dimmer)}
.stepper .u{font-family:var(--mono);font-size:10px;color:var(--dimmer);padding-right:9px}
.tick{width:42px;height:42px;flex:none;border:1px solid var(--line);border-radius:7px;color:var(--dimmer);font-size:16px;display:flex;align-items:center;justify-content:center;background:var(--panel2);transition:.15s}
.tick.on{background:var(--greenDim);border-color:var(--green);color:var(--greenTxt)}

.verd{border-radius:8px;padding:11px 12px;margin-top:11px;font-size:13px;line-height:1.5}
.verd .eyebrow{display:block;margin-bottom:4px}
.verd.sube{background:#15110A;border:1px solid var(--goldDim);color:var(--goldSoft)}
.verd.sube .eyebrow{color:var(--gold)}
.verd.mant{background:var(--panel2);border:1px solid var(--line);color:#B4BAB5}
.verd.baja{background:var(--redDim);border:1px solid #4A2722;color:#D6A9A2}
.verd.baja .eyebrow{color:var(--red)}

.actions{display:flex;gap:7px;margin-top:11px}
.act{flex:1;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--dim);text-align:center;background:var(--panel2)}
.act.rest{color:var(--gold);border-color:var(--goldDim)}
.note{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:11px;font-size:12.5px;color:var(--dim);line-height:1.55}
.note .eyebrow{display:block;margin-bottom:4px}
.tip{font-size:12.5px;color:var(--dim);line-height:1.55;margin:11px 0 0;padding-top:11px;border-top:1px solid var(--line)}

.frow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:none}
.frow .n{flex:1;font-size:13.5px;font-weight:500}
.frow .n s{display:block;font-family:var(--mono);font-size:10px;color:var(--dimmer);text-decoration:none;letter-spacing:.06em;margin-top:2px;font-weight:400}
.fw{width:76px;flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:10px 6px;text-align:center;font-family:var(--mono);font-size:16px}

.close{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px;margin-top:16px}
.close h3{font-size:14px;font-weight:500;margin:0 0 3px}
.crow{margin-top:12px}
.crow .eyebrow{display:block;margin-bottom:7px}
.chips{display:flex;gap:6px}
.chip{flex:1;padding:11px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:12.5px;color:var(--dim);text-align:center}
.chip.on{background:var(--greenDim);border-color:var(--green);color:var(--text)}
.chip.on.warn{background:var(--redDim);border-color:#4A2722;color:#D6A9A2}
.alerta{margin-top:11px;font-size:12.5px;color:#D6A9A2;line-height:1.5}

.rest{flex:none;display:none;border-top:1px solid var(--goldDim);background:#0F0C05;padding:13px 16px 14px;align-items:center;gap:12px;position:relative}
.rest.on{display:flex}
.rbar{position:absolute;top:0;left:0;height:2px;background:var(--gold);transition:width 1s linear}
.rleft{flex:1;min-width:0}
.rleft .eyebrow{color:var(--gold)}
.rleft .nm{font-size:12.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtime{font-family:var(--mono);font-size:31px;color:var(--gold);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.rbtn{width:46px;height:42px;border:1px solid var(--goldDim);border-radius:8px;color:var(--gold);font-family:var(--mono);font-size:11px;flex:none}

.gsearch{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px;font-size:16px;margin-bottom:12px}
.gsearch::placeholder{color:var(--dimmer)}
.gsec{margin:18px 0 9px}
.gitem{border-bottom:1px solid var(--line)}
.gitem>button{width:100%;text-align:left;padding:13px 2px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.gitem h3{font-size:14.5px;font-weight:500;margin:0}
.gitem .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--dimmer);text-transform:uppercase;flex:none}
.gbody{display:none;padding:0 2px 15px;font-size:13.5px;color:#BFC5C0;line-height:1.62}
.gitem.open .gbody{display:block}
.gbody p{margin:0 0 9px}
.gbody .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--greenTxt);text-transform:uppercase;display:block;margin-bottom:3px}
.gbody b{color:var(--text);font-weight:500}
.saludo{padding:26px 4px 4px}
.saludo .h{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 0}
.saludo .f{font-size:13.5px;color:var(--dim);margin-top:5px}
.hero{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:18px;margin:20px 0 14px}
.hero .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.hero .t{font-size:20px;font-weight:700;margin:7px 0 0;letter-spacing:-.015em}
.hero .s{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:6px;letter-spacing:.02em}
.go{display:block;width:100%;padding:17px;border-radius:10px;background:var(--gold);color:#100C00;font-size:15.5px;font-weight:700;text-align:center;margin-top:17px;letter-spacing:.01em}
.go.cont{background:var(--greenDim);border:1px solid var(--green);color:var(--text)}
.go.cont span{font-family:var(--mono);color:var(--greenTxt);font-weight:400}
.ver{display:block;width:100%;text-align:center;padding:13px;font-size:13px;color:var(--dim);margin-top:2px}
.sem{display:flex;gap:5px;margin:9px 0 0}
.sem div{flex:1;text-align:center;padding:10px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:11px;color:var(--dimmer)}

const GLO_C=[
['RIR','Esfuerzo','<span class="lbl">Qué es</span><p>Repeticiones en reserva: cuántas más te salían limpias cuando paraste la serie. RIR 2 = podías hacer 2 más.</p><span class="lbl">Cuándo va cada uno</span><p><b>RIR 3</b> — toda la semana 1, el peso muerto rumano en semanas 1-2, y cualquier ejercicio de pierna con la rodilla en amarillo.<br><b>RIR 2</b> — compuestos: jalones, remos, press, hip thrust, prensa, rumano, hiperextensión, extensión de cuádriceps.<br><b>RIR 1</b> — aislamientos: laterales, pájaros, curls, tríceps, curl femoral, abducción, pantorrilla.<br><b>RIR 0</b> — solo la última serie de los aislamientos que lo indican.</p><p><b>Nunca RIR 0</b> en peso muerto rumano, hip thrust, prensa, extensión de cuádriceps ni press con mancuernas.</p><span class="lbl">Cómo calcularlo</span><p>Al terminar la serie pregúntate cuántas más te salían limpias. De vez en cuando lleva al fallo la última serie de una lateral o un curl en polea y compara con lo que creías: así se calibra.</p>'],
['Fallo muscular','Esfuerzo','<p>El punto donde ya no completas una repetición más con buena técnica. No es donde duele: es donde el peso deja de subir.</p><p>Un meta-análisis de 2023 encontró solo una ventaja trivial de ir al fallo. Un análisis de 2024 encontró que acercarse al fallo sí ayuda. Conclusión: entrenar cerca del fallo, casi nunca en el fallo.</p>'],
['Serie','Estructura','<p>Un bloque continuo de repeticiones. "3 × 8-12" son tres bloques, con descanso entre cada uno.</p>'],
['Repetición','Estructura','<p>Un ciclo completo del movimiento. Si la técnica se rompió para sacarla, no cuenta: no la anotes.</p>'],
['Rango de repeticiones','Estructura','<span class="lbl">Lo primero</span><p>El rango <b>no lo eliges tú</b>. Lo decide el peso.</p><span class="lbl">Cómo funciona</span><p>Eliges un peso y haces todas las repeticiones que puedas hasta llegar al RIR objetivo. El rango solo te dice si el peso está bien:</p><p>· Menos del mínimo → muy pesado.<br>· Más del máximo → muy ligero.<br>· Dentro del rango → correcto.</p><span class="lbl">Entre series</span><p>Mismo peso en todas. Las repeticiones bajan solas porque te cansas, y eso está bien: 50 × 12 · 50 × 10 · 50 × 9.</p>'],
['Doble progresión','Progreso','<span class="lbl">El sistema</span><p>1. Elige un peso con el que llegues al menos al mínimo del rango en todas las series.<br>2. Cada sesión intenta sumar repeticiones con el mismo peso. Con +1 en una sola serie ya cuenta.<br>3. Cuando hagas el máximo del rango en <b>todas</b> las series con el RIR objetivo, la siguiente sesión subes el peso.<br>4. Con el peso nuevo bajas cerca del mínimo. Vuelves al paso 2.</p><span class="lbl">Ejemplo · jalón 3 × 8-12</span><p>50 kg → 12, 10, 9 · mismo peso<br>50 kg → 12, 12, 12 · <b>sube</b><br>55 kg → 9, 8, 8 · empieza otra vez</p><span class="lbl">Qué haces según lo que pasó</span><p>· Todas al máximo con el RIR objetivo → sube.<br>· Dentro del rango → mismo peso, +1 repetición.<br>· Alguna abajo del mínimo → mismo peso. Dos sesiones seguidas → baja 5-10%.<br>· Rodilla amarilla → no subas peso ni rango.<br>· Rodilla roja → para y usa la alternativa.</p><p>La app hace este cálculo por ti al terminar cada ejercicio.</p>'],
['Saltos grandes de mancuerna','Progreso','<p>De 6 a 8 kg en una lateral es +33%: demasiado de golpe. Por eso esos ejercicios usan rango 12-20.</p><p>Cuando llegas a 20 en todas las series, la siguiente sesión haces <b>solo la primera serie</b> con el peso nuevo y el resto con el anterior. Cada sesión pasas una serie más al peso nuevo, hasta que todas lleguen a 12 o más con él.</p><p>La app te lo precarga así sola.</p>'],
['Sobrecarga progresiva','Progreso','<p>El músculo crece cuando le pides un poco más de lo que ya tolera: más peso, más repeticiones o el mismo peso con mejor técnica. Sin registro no sabes qué superar.</p>'],
['Semanas 1 a 4','Programa','<p><b>Semana 1 · Calibración.</b> Una serie menos por ejercicio (mínimo 2) y todo a RIR 3-4. Solo encuentras pesos y ves cómo responde la rodilla.<br><b>Semana 2 · Base.</b> Series completas, un RIR más que el objetivo (compuestos 3, aislamientos 2).<br><b>Semanas 3 y 4 · Carga.</b> Series completas al RIR objetivo. Progresas.<br><b>Fin de la semana 4.</b> Check-in con fotos y medidas.<br><b>Semana 5.</b> Se decide en el check-in: descarga solo si hay señales de fatiga.</p>'],
['Descanso','Estructura','<p>Cada ejercicio trae el suyo y la app lo cuenta sola al marcar la serie. Regla simple: la siguiente serie no debe salir peor porque sigues jadeando.</p><p>Descansar poco no quema más grasa; solo empeora la siguiente serie.</p>'],
['Superserie','Estructura','<p>Dos ejercicios seguidos sin descanso entre ellos; descansas después del segundo. Se usan con músculos que no se estorban (lateral + pájaros, curl + tríceps) y ahorran tiempo.</p><p>En la app, al marcar la serie del primero te avisa que sigue el segundo; el descanso arranca al marcar el segundo.</p>'],
['Tempo','Técnica','<p>La velocidad de cada fase. En general: bajar controlado (2-3 s) y subir firme. Solo se indica donde ayuda; las pausas en pantorrilla, hip thrust y abducción sí importan.</p>'],
['Calentamiento','Estructura','<p><b>Días de torso:</b> 5 min de cardio suave y 2 series de aproximación en el primer ejercicio de jalar y en el primero de empujar.</p><p><b>Días de pierna:</b> 5-8 min de bici con el asiento alto, y el bloque de tu fisio sin peso: sentadilla al rango cómodo 1 × 12 y desplante estático 1 × 10 por pierna.</p>'],
['Series de aproximación','Estructura','<p>Series ligeras antes de las de trabajo: 1 × 10 con ~50% del peso y 1 × 5 con ~75%. No cuentan y no se registran.</p>'],
['Semáforo de rodilla','Rodilla','<p>Va en los ejercicios marcados con el ícono de rodilla. Calificas el dolor de 0 a 10 durante el ejercicio.</p><p><b>Verde · 0-2</b>, y al día siguiente igual o mejor → sigue y progresa normal.<br><b>Amarillo · 3-4</b>, o más molestia al día siguiente que se quita en menos de 24 h → no subas peso ni rango, acorta el rango si hace falta, RIR 3.<br><b>Rojo · 5 o más</b>, dolor que sigue al otro día, hinchazón, que la rodilla se trabe o se "vaya" → para ese ejercicio y usa la alternativa sin dolor. Si se repite en dos sesiones: médico o fisio.</p><p>Es una regla práctica de monitoreo de dolor que se usa en rehabilitación. No es un diagnóstico.</p>'],
['Condromalacia rotuliana','Rodilla','<p>Es lo que te dijeron que tienes en la rodilla. El programa no la trata: solo usa reglas conservadoras mientras no tengas fisio.</p><p>La guía de fisioterapeutas de Estados Unidos (2019) para dolor de rótula pone como base ejercicios de glúteo y cuádriceps. Por eso hay hip thrust, abducción, prensa y extensión en rangos controlados.</p><p>Lo recomendado de verdad: una consulta de revisión con tu fisio o un médico del deporte que confirme los rangos de prensa y extensión.</p>'],
['Bisagra de cadera','Técnica','<p>Doblarte desde la cadera, no desde la espalda: la cadera va hacia atrás, la espalda queda recta y las rodillas apenas dobladas. Es el movimiento del peso muerto rumano y de la hiperextensión. Por eso el rumano va a RIR 3 en las semanas 1 y 2: para aprenderla bien.</p>'],
['Concéntrica y excéntrica','Técnica','<p><b>Concéntrica:</b> la fase en que vences el peso (subir en el curl, empujar en el press).<br><b>Excéntrica:</b> la fase en que lo frenas (bajar). Es donde casi todos se apuran y pierden estímulo.</p>'],
['Respiración','Técnica','<p>Inhala en la bajada y exhala en el esfuerzo. En press y jalón: inhala al bajar o al estirarte, exhala al empujar o jalar. En aislamientos largos respira normal.</p><p>Nunca aguantes la respiración toda la serie. Si te mareas o ves puntos, estabas aguantando de más.</p>'],
['Rango de movimiento','Técnica','<p>Cuánto recorrido hace la articulación. Recorridos completos, sobre todo con el músculo estirado, suelen dar más crecimiento que medio recorrido con más peso.</p><p>La excepción en tu programa es a propósito: la extensión de cuádriceps de 90° a 45° y la prensa hasta donde no duela, por la rodilla.</p>'],
['Posición estirada','Técnica','<p>El punto donde el músculo está más largo: abajo del curl inclinado, atrás de la cabeza en la extensión de tríceps, arriba del jalón. Varios ejercicios del programa están elegidos por cargar ahí.</p>'],
['Escápula','Técnica','<p>El omóplato. Juntarlas y bajarlas da una base estable para empujar y jalar. En los pájaros y la lateral, en cambio, no se trata de juntarlas sino de llevar los brazos lejos.</p>'],
['Agarres','Técnica','<p><b>Prono:</b> palmas hacia abajo o al frente.<br><b>Supino:</b> palmas hacia arriba o hacia ti.<br><b>Neutro:</b> palmas enfrentadas.</p>'],
['Unilateral','Técnica','<p>Un lado a la vez. En la app, cuando dice "por lado", las repeticiones que anotas son las de un lado.</p>'],
['Volumen','Estructura','<p>Series efectivas por músculo a la semana. Tu programa arranca en 97 series (69 en la semana 1). Es un punto de partida, no un número fijo: se ajusta en el check-in. Más no siempre es mejor.</p>'],
['Frecuencia','Estructura','<p>Cuántas veces por semana entrenas un músculo. Tus prioridades 1 se entrenan 2 o 3 veces por semana.</p>'],
['Prioridades 1, 2 y 3','Programa','<p><b>1 · mucho énfasis:</b> deltoide lateral, dorsal, tríceps, glúteo (mayor y medio) y deltoide posterior.<br><b>2 · moderado:</b> pecho superior, bíceps, espalda media e isquiotibiales.<br><b>3 · mantenimiento:</b> cuádriceps, pantorrillas, deltoide anterior, pecho medio e inferior, trapecio, antebrazos y abdomen.</p>'],
['Recomposición','Programa','<p>Ganar músculo y perder grasa al mismo tiempo: comer más o menos lo que gastas, proteína alta y entrenar duro. Una revisión de 2020 concluyó que también pasa en gente que ya entrena.</p><p>No es para marcar abdomen. El ancho se ve por contraste: hombros más grandes junto a una cintura más chica.</p>'],
['Hombros ÷ cintura','Programa','<p>El número clave del check-in: la circunferencia de hombros dividida entre la cintura al ombligo. Tiene que subir. Se ataca por los dos lados: más hombro y espalda, menos cintura.</p><p>Lo registras en la pestaña Cuerpo.</p>'],
['Control de fatiga','Recuperación','<p>Al cerrar cada sesión anotas energía (1-5), horas de sueño y rodilla (0-10).</p><p><b>Semana ligera</b> (mitad de series, RIR 3) si se juntan 2 o más:<br>· Dormiste menos de 6 h de promedio.<br>· Energía de 2 o menos en 3 sesiones.<br>· Bajó el rendimiento en 3 o más ejercicios.<br>· Dolor articular que no se va.</p><p>La app revisa esto sola en la portada.</p>'],
['Si un músculo no progresa','Recuperación','<p>Revisa en este orden: 1) técnica, 2) esfuerzo (RIR real), 3) progresión, 4) recuperación, 5) volumen, 6) elección del ejercicio. El volumen no se sube automáticamente.</p>'],
['Agujetas','Recuperación','<p>El dolor muscular de 24-48 h después. No indica que el entrenamiento funcionó: puedes crecer sin agujetas y tener agujetas sin crecer.</p>'],
['Proteína','Recuperación','<p>Un meta-análisis de 2018 encontró que pasar de ~1.6 g por kilo al día ya casi no agrega músculo. Para ti son unos 115 g al día: una buena porción de proteína en cada una de tus 3 comidas.</p><p>Por tu colesterol, las cantidades y los alimentos los confirma tu médico o un nutriólogo.</p>'],
['Hipertrofia','Concepto','<p>El aumento del tamaño de la fibra muscular. Es lo que buscas. No es lo mismo que fuerza, aunque al principio van juntas.</p>']

const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const iso=d=>{const x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const fecha=s=>new Date(s+'T00:00');
const masDias=(s,n)=>{const d=fecha(s);d.setDate(d.getDate()+n);return iso(d)};
const difDias=(a,b)=>Math.round((fecha(a)-fecha(b))/864e5);
function lunesDe(s){const d=fecha(s),w=d.getDay();const off=w===0?-6:1-w;d.setDate(d.getDate()+off);return iso(d)}
const r2=x=>Math.round(x*100)/100;
function aIncremento(x,inc){return r2(Math.round(x/inc)*inc)}

/* ── programa ── */
function validaPlan(p){
  const err=[];
  if(!p||typeof p!=='object')return ['No es un archivo de programa'];
  if(p.formato!=='mosbyfit-programa')err.push('Falta "formato": "mosbyfit-programa"');
  if(!Array.isArray(p.dias)||!p.dias.length)err.push('No trae días');
  else p.dias.forEach((d,i)=>{
    if(DIAS.indexOf(d.id)<0)err.push('Día '+(i+1)+': id debe ser lun, mar, mie, jue o vie');
    if(!Array.isArray(d.ejercicios)||!d.ejercicios.length)err.push('Día '+d.id+': sin ejercicios');
    else d.ejercicios.forEach(e=>{
      const q=d.id+' · '+(e.nombre||e.id||'?');
      if(!e.id||!e.nombre)err.push(q+': falta id o nombre');
      if(!(e.series>0))err.push(q+': series inválidas');
      if(!Array.isArray(e.reps)||e.reps.length!==2||!(e.reps[0]>0)||!(e.reps[1]>=e.reps[0]))err.push(q+': reps debe ser [mínimo, máximo]');
      if(!(e.rir>=0))err.push(q+': falta rir');
      if(!(e.descanso_seg>0))err.push(q+': falta descanso_seg');
    });
  });
  if(!Array.isArray(p.semanas)||!p.semanas.length)err.push('No trae semanas');
  if(err.length)return err;
  const ids=[];p.dias.forEach(d=>d.ejercicios.forEach(e=>ids.push(e.id)));
  if(new Set(ids).size!==ids.length)return ['Hay ids de ejercicio repetidos'];
  return [];
}
function normalizaPlan(p){
  p.dias.forEach(d=>d.ejercicios.forEach(e=>{
    e.clave=e.clave||e.id;
    e.series_semana1=e.series_semana1||Math.max(2,e.series-1);
    e.incremento=e.incremento>0?e.incremento:2.5;
    e.alternativas=Array.isArray(e.alternativas)?e.alternativas.filter(a=>a&&a.nombre):[];
    if(e.rir_ultima_serie===undefined)e.rir_ultima_serie=null;
  }));
  return p;
}
function diaPlan(plan,k){return plan.dias.find(d=>d.id===k)||null}
function todos(plan){const o=[];plan.dias.forEach(d=>d.ejercicios.forEach(e=>o.push({e,d})));return o}
function porId(plan,id){const x=todos(plan).find(t=>t.e.id===id);return x?x.e:null}
function nombreDeClave(plan,key){
  const [c,a]=key.split('~');
  const x=todos(plan).find(t=>t.e.clave===c);
  if(!x)return key;
  if(!a)return x.e.nombre;
  const alt=x.e.alternativas[+a-1];return alt?alt.nombre:key;
}

/* ── semanas ── */
function inicioDe(DB,plan){return DB.inicioProg||plan.inicio}
function checkinDe(DB,plan){return masDias(lunesDe(inicioDe(DB,plan)),26)}
function semanaDe(f,DB,plan){
  const n=Math.floor(difDias(f,lunesDe(inicioDe(DB,plan)))/7)+1;
  return Math.max(1,n);
}
function infoSemana(plan,n){
  const S=plan.semanas,ult=S[S.length-1];
  const s=S.find(x=>x.n===n);
  if(s)return Object.assign({extra:false},s);
  return Object.assign({},ult,{n,extra:true,nombre:'Check-in pendiente',checkin:false});
}
function seriesPara(e,sem){return sem.usa_series_semana1?e.series_semana1:e.series}
function rirPara(e,sem,i,total,amarilla){
  if(sem.rir_fijo!=null)return sem.rir_fijo;
  let r=e.rir;
  if(i===total-1&&e.rir_ultima_serie!=null&&!(sem.rir_extra>0))r=e.rir_ultima_serie;
  r+=sem.rir_extra||0;
  if(amarilla&&e.rodilla)r=Math.max(r,3);
  return r;
}
function rirTexto(e,sem,total,amarilla){
  if(sem.rir_texto)return sem.rir_texto;
  const a=rirPara(e,sem,0,total,amarilla),b=rirPara(e,sem,total-1,total,amarilla);
  return a===b?String(a):a+' · últ. '+b;
}

/* ── registro ── */
function claveEf(e,alt){return alt?e.clave+'~'+alt:e.clave}
function altDe(DB,f,e){return ((DB.alt||{})[f]||{})[e.id]||0}
function okSets(v){return Array.isArray(v)?v.filter(s=>s&&s.ok&&s.p!=null&&s.r!=null):[]}
function sesionesDe(DB,key,antesDe){
  return Object.keys(DB.log).filter(f=>(!antesDe||f<antesDe)&&okSets(DB.log[f][key]).length).sort()
    .map(f=>{const v=okSets(DB.log[f][key]);
      return {f,v,total:DB.log[f][key].length,vol:Math.round(v.reduce((a,s)=>a+s.p*s.r,0)),
              tope:v.reduce((a,s)=>Math.max(a,s.p),0),rod:((DB.rod||{})[f]||{})[key]}});
}
function ultimaDe(DB,key,hoy){const s=sesionesDe(DB,key,hoy);return s.length?s[s.length-1]:null}
function colorRodilla(n){if(n==null||n==='')return null;n=+n;return n>=5?'rojo':(n>=3?'amarillo':'verde')}

/* ── veredicto · tabla 4.2 del programa ──
   e: ejercicio · sets: registro de esa sesión · ctx: {sem, rod, prev (sesión anterior), pct} */
function veredicto(e,sets,ctx){
  const ok=okSets(sets), total=Array.isArray(sets)?sets.length:0;
  if(!ok.length)return null;
  const [mn,mx]=e.reps, inc=e.incremento, c=ctx||{}, sem=c.sem||{progresa:true}, kg=x=>r2(x)+' kg';
  const pesos=ok.map(s=>s.p), p=pesos[0], todosIg=pesos.every(x=>x===p);
  const igual={pesos:ok.map(s=>s.p)};
  const col=colorRodilla(c.rod);
  if(col==='rojo')return {t:'rojo',h:'Rodilla en rojo',sug:igual,
    m:'Para este ejercicio. La próxima vez usa <b>la alternativa sin dolor</b>. Si se repite en dos sesiones: médico o fisio.'};
  if(ok.length<total)return {t:'parcial',h:'Sesión incompleta',sug:igual,
    m:'Hiciste '+ok.length+' de '+total+' series. Sin veredicto: la próxima vez repite el peso.'};
  if(col==='amarillo')return {t:'amar',h:'Rodilla en amarillo',sug:igual,
    m:'No subas peso ni rango. La próxima vez: <b>mismo peso y RIR 3</b>, y acorta el rango si hace falta.'};

  if(!sem.progresa){
    if(!todosIg)return {t:'calib',h:'Calibración',sug:{pesos:Array(total).fill(Math.max(...pesos))},
      m:'Esta semana solo buscas el peso. Para la próxima usa uno solo en todas las series.'};
    if(ok.every(s=>s.r>=mx))return {t:'calib',h:'Calibración · muy ligero',sug:{pesos:Array(total).fill(r2(p+inc))},
      m:'Llegaste al máximo aun con margen. La semana que entra empieza con <b>'+kg(p+inc)+'</b>.'};
    if(ok.some(s=>s.r<mn-1)){const b=Math.max(0,r2(p-inc));return {t:'calib',h:'Calibración · muy pesado',sug:{pesos:Array(total).fill(b)},
      m:'Quedaste lejos del mínimo. La semana que entra prueba con <b>'+kg(b)+'</b>.'}}
    return {t:'calib',h:'Calibración · peso encontrado',sug:igual,
      m:'Ese es tu peso de arranque. La semana 2 sigue con <b>'+kg(p)+'</b>.'};
  }

  if(!todosIg){
    if(e.transicion){
      const pmax=Math.max(...pesos), pmin=Math.min(...pesos);
      const nNuevo=pesos.filter(x=>x===pmax).length;
      const listos=ok.filter(s=>s.p===pmax).every(s=>s.r>=mn);
      const sig=listos?nNuevo+1:nNuevo;
      const dist=Array.from({length:total},(_,i)=>i<sig?pmax:pmin);
      if(sig>=total)return {t:'trans',h:'Transición terminada',sug:{pesos:Array(total).fill(pmax)},
        m:'Todas las series pasan a <b>'+kg(pmax)+'</b>. A partir de ahí, doble progresión normal.'};
      return {t:'trans',h:listos?'Una serie más al peso nuevo':'Transición · repite',sug:{pesos:dist},
        m:listos?'La próxima vez: <b>'+sig+' series con '+kg(pmax)+'</b> y el resto con '+kg(pmin)+'.'
                :'La serie con '+kg(pmax)+' no llegó a '+mn+'. Repite la misma combinación.'};
    }
    return {t:'mezcla',h:'Usa un solo peso',sug:{pesos:Array(total).fill(p)},
      m:'Cambiaste de peso entre series. La doble progresión necesita <b>el mismo peso en todas</b>.'};
  }

  if(ok.every(s=>s.r>=mx)){
    const corto=ok.some((s,i)=>s.rir!=null&&c.rirObj&&s.rir<c.rirObj[i]);
    if(corto)return {t:'mant',h:'Al máximo, pero muy al límite',sug:igual,
      m:'Llegaste a '+mx+' más cerca del fallo de lo que tocaba. Repite <b>'+kg(p)+'</b> una vez más.'};
    if(e.transicion)return {t:'sube',h:'Sube el peso, de a poco',sug:{pesos:Array.from({length:total},(_,i)=>i===0?r2(p+inc):p)},
      m:'Con mancuerna el salto es grande. La próxima vez: <b>solo la primera serie con '+kg(p+inc)+'</b> y el resto con '+kg(p)+'.'};
    return {t:'sube',h:'Sube el peso',sug:{pesos:Array(total).fill(r2(p+inc)),reps:mn},
      m:'Todas las series llegaron a '+mx+'. La próxima vez arranca con <b>'+kg(p+inc)+'</b>; vas a caer cerca de '+mn+' y es lo esperado.'};
  }
  if(ok.some(s=>s.r<mn)){
    const prevBajo=c.prev&&okSets(c.prev.v||c.prev).some(s=>s.r<mn&&s.p>=p);
    if(prevBajo){
      let b=aIncremento(p*(1-(c.pct||0.075)),inc);if(b>=p)b=r2(p-inc);b=Math.max(0,b);
      return {t:'baja',h:'Baja el peso',sug:{pesos:Array(total).fill(b)},
        m:'Dos sesiones seguidas abajo de '+mn+'. La próxima vez baja a <b>'+kg(b)+'</b> (5-10% menos).'};
    }
    return {t:'mant',h:'Alguna serie quedó corta',sug:igual,
      m:'Mismo peso la próxima vez. Si vuelve a quedar abajo de '+mn+', la app te baja el peso.'};
  }
  return {t:'mant',h:'Peso correcto',sug:igual,
    m:'Todo dentro de '+mn+'-'+mx+'. La próxima vez: <b>mismo peso</b> y busca +1 repetición.'};
}

/* contexto con el que se juzgó una sesión pasada */
function ctxDe(DB,plan,e,key,s,todas){
  const sem=infoSemana(plan,semanaDe(s.f,DB,plan));
  const i=todas.findIndex(x=>x.f===s.f);
  const n=s.total;
  const prevRod=i>0?todas[i-1].rod:null;
  const rirObj=Array.from({length:n},(_,j)=>rirPara(e,sem,j,n,colorRodilla(prevRod)==='amarillo'));
  return {sem,rod:s.rod,prev:i>0?todas[i-1]:null,rirObj,pct:(plan.regla_progresion||{}).baja_pct};
}

/* lo que se precarga hoy */
function precarga(DB,plan,e,key,hoy,n){
  const todas=sesionesDe(DB,key,hoy);
  const u=todas[todas.length-1];
  if(!u)return {u:null,ver:null,pesos:Array(n).fill(null),reps:Array(n).fill(null)};
  const ver=veredicto(e,DB.log[u.f][key],ctxDe(DB,plan,e,key,u,todas));
  const base=u.v;
  const pes=ver&&ver.sug&&ver.sug.pesos?ver.sug.pesos:base.map(s=>s.p);
  const pesos=Array.from({length:n},(_,i)=>pes[i]!=null?pes[i]:pes[pes.length-1]);
  const reps=Array.from({length:n},(_,i)=>{
    if(ver&&ver.sug&&ver.sug.reps)return ver.sug.reps;
    const b=base[i]||base[base.length-1];
    return pesos[i]!==b.p?e.reps[0]:b.r;
  });
  return {u,ver,pesos,reps,dias:difDias(hoy,u.f)};
}

/* ── control de fatiga · sección 4.7 ── */
function fatiga(DB,plan,hoy){
  const desde=masDias(hoy,-7);
  const ses=Object.keys(DB.sesiones||{}).filter(f=>f>desde&&f<=hoy).map(f=>DB.sesiones[f]).filter(s=>s&&s.t1&&!s.incompleta);
  const se=[];
  const sue=ses.map(s=>s.sueno).filter(x=>x>0);
  if(sue.length>=2&&sue.reduce((a,b)=>a+b,0)/sue.length<6)se.push('Promedio de sueño abajo de 6 h');
  if(ses.filter(s=>s.energia>0&&s.energia<=2).length>=3)se.push('Energía de 2 o menos en 3 sesiones');
  const claves=new Set();Object.keys(DB.log).filter(f=>f>desde&&f<=hoy).forEach(f=>Object.keys(DB.log[f]).forEach(k=>claves.add(k)));
  let bajo=0;
  claves.forEach(k=>{const s=sesionesDe(DB,k).filter(x=>x.f<=hoy);if(s.length<2)return;
    const a=s[s.length-2],b=s[s.length-1];if(b.f<=desde)return;
    if(b.tope<=a.tope&&b.vol<a.vol*0.95)bajo++;});
  if(bajo>=3)se.push('Bajó el rendimiento en '+bajo+' ejercicios');
  if(ses.filter(s=>s.rodilla>=3).length>=2)se.push('Molestia de rodilla en 2 o más sesiones');
  return {senales:se,ligera:se.length>=2,sesiones:ses.length};
}

/* ── cuerpo ── */
function medidasOrden(DB){return Object.keys(DB.medidas||{}).sort().map(f=>Object.assign({f},DB.medidas[f]))}
function ratio(m){return m&&m.hombros>0&&m.cintura>0?Math.round(m.hombros/m.cintura*1000)/1000:null}
function pesoSemana(DB,hoy){
  const d=masDias(hoy,-6);const v=Object.keys(DB.pesos||{}).filter(f=>f>=d&&f<=hoy).map(f=>DB.pesos[f]).filter(x=>x>0);
  return v.length?{prom:r2(v.reduce((a,b)=>a+b,0)/v.length),n:v.length}:null;
}

/* ── validación de datos guardados ── */
function sanea(o){
  const d={v:FORMATO,inicioProg:null,log:{},alt:{},rod:{},sesiones:{},medidas:{},pesos:{},desc:null,ses:null,visto:false,respaldo:null};
  if(!o||typeof o!=='object')return d;
  if(o.v&&o.v>FORMATO){d._futuro=true;return d}
  const ob=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{};
  const num=x=>x!==null&&x!==''&&isFinite(x)?+x:null;
  const isoOk=s=>typeof s==='string'&&/^\d{4}-\d\d-\d\d$/.test(s);
  if(o.v===FORMATO&&isoOk(o.inicioProg))d.inicioProg=o.inicioProg;
  d.visto=o.v===FORMATO&&!!o.visto;
  if(isoOk(o.respaldo))d.respaldo=o.respaldo;
  for(const f in ob(o.log)){if(!isoOk(f))continue;const x=ob(o.log[f]),y={};
    for(const k in x)if(Array.isArray(x[k]))y[k]=x[k].map(s=>({p:num(s&&s.p)!=null?Math.max(0,num(s.p)):null,r:num(s&&s.r)!=null?Math.max(0,num(s.r)):null,
      rir:num(s&&s.rir)!=null?Math.min(10,Math.max(0,num(s.rir))):null,ok:!!(s&&s.ok)}));
    if(Object.keys(y).length)d.log[f]=y;}
  for(const f in ob(o.alt)){const x=ob(o.alt[f]),y={};for(const k in x)if(x[k]===1||x[k]===2)y[k]=x[k];if(Object.keys(y).length)d.alt[f]=y;}
  for(const f in ob(o.rod)){const x=ob(o.rod[f]),y={};for(const k in x){const n=num(x[k]);if(n!=null&&n>=0&&n<=10)y[k]=n}if(Object.keys(y).length)d.rod[f]=y;}
  for(const f in ob(o.sesiones)){const s=o.sesiones[f];if(!s||!isFinite(s.t0))continue;
    d.sesiones[f]={dia:DIAS.indexOf(s.dia)>=0?s.dia:'lun',t0:+s.t0,t1:isFinite(s.t1)&&s.t1!==null?+s.t1:null,incompleta:!!s.incompleta,
      energia:num(s.energia)>=1&&num(s.energia)<=5?num(s.energia):null,sueno:num(s.sueno)>0&&num(s.sueno)<=16?num(s.sueno):null,
      rodilla:num(s.rodilla)!=null&&num(s.rodilla)>=0&&num(s.rodilla)<=10?num(s.rodilla):null};}
  const CAMPOS=['cintura','hombros','brazo','pecho','muslo','pantorrilla'];
  for(const f in ob(o.medidas)){if(!isoOk(f))continue;const x=ob(o.medidas[f]),y={};CAMPOS.forEach(c=>{const n=num(x[c]);if(n>0&&n<300)y[c]=n});if(Object.keys(y).length)d.medidas[f]=y;}
  for(const f in ob(o.pesos)){const n=num(o.pesos[f]);if(isoOk(f)&&n>20&&n<300)d.pesos[f]=n;}
  if(o.desc&&isFinite(o.desc.fin))d.desc={fin:+o.desc.fin,tot:+o.desc.tot||90,n:String(o.desc.n||'')};
  if(o.ses&&isoOk(o.ses.f))d.ses={f:o.ses.f,dia:DIAS.indexOf(o.ses.dia)>=0?o.ses.dia:'lun',ab:typeof o.ses.ab==='string'?o.ses.ab:null,sc:+o.ses.sc||0};
  return d;
}
function fusionar(DB,o){
  ['log','alt','rod','sesiones','medidas','pesos'].forEach(c=>{
    DB[c]=DB[c]||{};
    for(const f in (o[c]||{}))DB[c][f]=typeof o[c][f]==='object'?Object.assign({},DB[c][f],o[c][f]):o[c][f];
  });
  if(o.inicioProg&&!DB.inicioProg)DB.inicioProg=o.inicioProg;
  return DB;
}
function cuentaSesiones(o){return Object.keys(o.log||{}).filter(f=>Object.values(o.log[f]).some(v=>okSets(v).length)).length}

/* ── texto para exportar ── */
function hms(seg){const h=Math.floor(seg/3600),m=Math.floor(seg%3600/60);return h?h+'h '+String(m).padStart(2,'0')+'m':m+'m '+String(seg%60).padStart(2,'0')+'s'}
function hhmm(t){const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function texto(DB,plan,hoy,desde){
  const L=[];
  L.push('MOSBYFIT · REGISTRO');
  L.push(plan.nombre);
  L.push('Inicio: '+inicioDe(DB,plan)+'   Check-in: '+checkinDe(DB,plan)+'   Exportado: '+hoy+'   Semana '+semanaDe(hoy,DB,plan));
  L.push('Formato: peso x reps @RIR sentido, por serie. * = alternativa');
  const fs=[...new Set([...Object.keys(DB.log),...Object.keys(DB.sesiones||{})])].filter(f=>!desde||f>=desde).sort();
  let n=0;
  const T=todos(plan);
  fs.forEach(f=>{
    const LG=DB.log[f]||{},S=(DB.sesiones||{})[f];
    const keys=Object.keys(LG).filter(k=>okSets(LG[k]).length);
    if(!keys.length&&!(S&&S.t1))return;
    n++;
    const wd=fecha(f).getDay(),dk=wd>=1&&wd<=5?DIAS[wd-1]:null;
    const real=S&&diaPlan(plan,S.dia)?S.dia:dk;
    const D=real?diaPlan(plan,real):null;
    L.push('');L.push('-'.repeat(46));
    L.push(f+'   '+(f<lunesDe(inicioDe(DB,plan))?'práctica':'sem '+semanaDe(f,DB,plan))+(D?'   '+NOM[real]+' · '+D.nombre:''));
    if(real&&dk&&real!==dk)L.push('  (hecho en '+LARGO[dk]+')');
    if(S&&S.t1&&!S.incompleta)L.push('  '+hhmm(S.t0)+' a '+hhmm(S.t1)+'   duracion '+hms(Math.floor((S.t1-S.t0)/1000)));
    const orden=D?D.ejercicios.map(e=>e.clave):[];
    keys.sort((a,b)=>{const ia=orden.indexOf(a.split('~')[0]),ib=orden.indexOf(b.split('~')[0]);return (ia<0?99:ia)-(ib<0?99:ib)});
    keys.forEach(k=>{
      const nm=nombreDeClave(plan,k)+(k.indexOf('~')>0?' *':'');
      const v=okSets(LG[k]).map(s=>s.p+'x'+s.r+(s.rir!=null?'@'+s.rir:'')).join('  ');
      const rd=((DB.rod||{})[f]||{})[k];
      L.push('  '+(nm+' '.repeat(44)).slice(0,44)+v+(rd!=null?'   rodilla '+rd+'/10':''));
    });
    if(S&&(S.energia||S.sueno||S.rodilla!=null))
      L.push('  · energia '+(S.energia||'-')+'/5 · sueno '+(S.sueno||'-')+' h · rodilla '+(S.rodilla!=null?S.rodilla:'-')+'/10');
  });
  if(!n)L.push('','Todavía no hay sesiones registradas.');
  const M=medidasOrden(DB).filter(m=>!desde||m.f>=desde);
  if(M.length){
    L.push('','-'.repeat(46),'MEDIDAS (cm)');
    M.forEach(m=>L.push('  '+m.f+'  cintura '+(m.cintura||'-')+' · hombros '+(m.hombros||'-')+' · brazo '+(m.brazo||'-')+' · pecho '+(m.pecho||'-')+' · muslo '+(m.muslo||'-')+' · pantorrilla '+(m.pantorrilla||'-')+(ratio(m)?'   H/C '+ratio(m):'')));
  }
  const P=Object.keys(DB.pesos||{}).filter(f=>!desde||f>=desde).sort();
  if(P.length){L.push('','PESO CORPORAL (kg)');L.push('  '+P.map(f=>f.slice(5)+' '+DB.pesos[f]).join(' · '));}
  L.push('','-'.repeat(46),'fin del registro');

}

/* ── calendario ── */
function ics(plan,DB,hora,ahora){
  const [H,Mi]=(hora||'17:00').split(':').map(Number);
  const d2=n=>String(n).padStart(2,'0');
  const fmt=d=>d.getFullYear()+d2(d.getMonth()+1)+d2(d.getDate())+'T'+d2(d.getHours())+d2(d.getMinutes())+'00';
  const BY={lun:'MO',mar:'TU',mie:'WE',jue:'TH',vie:'FR'};
  const lun=lunesDe(inicioDe(DB,plan));
  let s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//MosbyFit//ES\r\nCALSCALE:GREGORIAN\r\n';
  plan.dias.forEach(D=>{
    const ini=fecha(masDias(lun,DIAS.indexOf(D.id)));ini.setHours(H,Mi,0,0);
    const fin=new Date(ini.getTime()+100*60000);
    const esc=t=>String(t).replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\;');
    s+='BEGIN:VEVENT\r\nUID:mosbyfit-'+plan.id+'-'+D.id+'@local\r\nDTSTAMP:'+fmt(ahora||new Date())+
      '\r\nDTSTART:'+fmt(ini)+'\r\nDTEND:'+fmt(fin)+'\r\nRRULE:FREQ=WEEKLY;BYDAY='+BY[D.id]+';COUNT='+plan.semanas.length+
      '\r\nSUMMARY:'+esc('MosbyFit · '+D.nombre)+
      '\r\nDESCRIPTION:'+esc(D.ejercicios.map(e=>e.nombre).join(' / '))+
      '\r\nBEGIN:VALARM\r\nTRIGGER:-PT30M\r\nACTION:DISPLAY\r\nDESCRIPTION:MosbyFit en 30 min\r\nEND:VALARM\r\nEND:VEVENT\r\n';
  });
  return s+'END:VCALENDAR\r\n';
}

function stepper(val,inc,cb){
  const w=E('div','stepper'),me=E('button',null,'−'),ma=E('button',null,'+');
  me.setAttribute('aria-label','Menos');ma.setAttribute('aria-label','Más');
  const i=E('input');i.type='number';i.inputMode='decimal';i.value=val!=null?val:'';i.placeholder='—';
  const set=v=>{v=Math.max(0,r2(v));i.value=v;cb(v);vibra(10)};
  me.onclick=()=>set((+i.value||0)-inc);ma.onclick=()=>set((+i.value||0)+inc);
  i.oninput=()=>{if(i.value===''){cb(null);return}let v=+i.value;if(!isFinite(v)||v<0){v=0;i.value=0}cb(v)};
  w.appendChild(me);w.appendChild(i);w.appendChild(ma);return w;
}

  return '<svg class="chart" viewBox="0 0 100 80" preserveAspectRatio="none" role="img" aria-label="Volumen por sesión">'+b+'</svg>';

  const sec=[['Conceptos',GLO_C],['Ejercicios del programa',ej]];
  sec.forEach(([t,L])=>{m.appendChild(E('div','gsec eyebrow',t+' · '+L.length));
    L.forEach(([ti,tag,body])=>{const it=E('div','gitem');it.dataset.q=(ti+' '+tag+' '+body).toLowerCase().replace(/<[^>]+>/g,' ');
      const b=E('button',null,'<h3>'+ti+'</h3><span class="tag">'+tag+'</span>');b.onclick=()=>it.classList.toggle('open');
      it.appendChild(b);it.appendChild(E('div','gbody',body));m.appendChild(it)})});
  const ne=E('div','empty','Nada con esa palabra.');ne.id='gnone';ne.style.display='none';m.appendChild(ne);
  if(gq)filtra();
}

/* ── exportar, respaldo y programa ── */
function vistaExp(m){
  const desde=rango==='prog'?masDias(lunesDe(inicioDe(DB,PLAN)),-7):null;
  const fs=Object.keys(DB.log).filter(f=>(!desde||f>=desde)&&Object.values(DB.log[f]).some(v=>okSets(v).length));
  let ns=0;fs.forEach(f=>Object.values(DB.log[f]).forEach(v=>ns+=okSets(v).length));
  const st=E('div','stats');[[fs.length,'Sesiones'],[ns,'Series'],[semanaDe(HOY,DB,PLAN),'Semana']].forEach(([v,k])=>st.appendChild(E('div','stat','<div class="v">'+v+'</div><div class="k">'+k+'</div>')));
  m.appendChild(st);
  const ch=E('div','chips');[['prog','Este programa'],['todo','Todo']].forEach(([k,t])=>{const b=E('button','chip'+(rango===k?' on':''),t);b.onclick=()=>{rango=k;pintar()};ch.appendChild(b)});
  m.appendChild(ch);
  const t=E('textarea');t.id='out';t.readOnly=true;t.value=texto(DB,PLAN,HOY,desde);m.appendChild(t);
  const c=E('button','btn p','Copiar reporte');c.onclick=async()=>{try{await navigator.clipboard.writeText(t.value);toast('Reporte copiado')}catch(e){t.focus();t.setSelectionRange(0,t.value.length);toast('Ya está seleccionado, cópialo')}};
  m.appendChild(c);
  m.appendChild(E('p','tip','En el check-in pégalo en el chat de entrenamiento junto con las fotos.'));
  const rb=E('div','blk','<span class="eyebrow">Respaldo · '+(DB.respaldo?'último: '+fechaLarga(DB.respaldo):'todavía ninguno')+'</span>');
  const two=E('div','two');const bk=E('button','btn s','↓ Guardar respaldo');bk.onclick=respaldar;const im=E('button','btn s','↑ Cargar respaldo');im.onclick=()=>elegirArchivo(cargarArchivo);
  two.appendChild(bk);two.appendChild(im);rb.appendChild(two);
  rb.appendChild(E('p','tip','Un archivo con todo tu registro y tu programa. Mándatelo por WhatsApp o guárdalo en Archivos, cada semana.'));
  m.appendChild(rb);
  const pr=E('div','blk','<span class="eyebrow">Programa</span>');
  pr.appendChild(E('div','ult','<div class="a">'+PLAN.nombre+'<s>'+PLAN.dias.length+' días · '+todos(PLAN).length+' ejercicios · check-in '+checkinDe(DB,PLAN)+'</s></div>'));
  const fi=E('div','row2');const fd=E('div','fld','<label>Fecha de inicio</label>');const di=E('input');di.type='date';di.value=inicioDe(DB,PLAN);
  di.onchange=()=>{if(!di.value)return;DB.inicioProg=di.value===PLAN.inicio?null:di.value;guardar();toast('Inicio: '+fechaLarga(di.value));pintar()};
  fd.appendChild(di);fi.appendChild(fd);pr.appendChild(fi);
  const two2=E('div','two');const cp=E('button','btn s','↑ Cargar programa');cp.onclick=()=>elegirArchivo(cargarArchivo);
  const dp=E('button','btn s','↓ Bajar programa');dp.onclick=()=>compartir(new Blob([JSON.stringify(PLAN,null,1)],{type:'application/json'}),'programa-'+PLAN.id+'.json','Programa guardado');
  two2.appendChild(cp);two2.appendChild(dp);pr.appendChild(two2);
  pr.appendChild(E('p','tip','Para el mes 2: te doy un archivo de programa, lo cargas aquí y listo. Tu registro se conserva.'));
  m.appendChild(pr);
  const z=E('button','btn d','Empezar de cero · borra el registro');let armado=false;
  z.onclick=async()=>{if(!armado){armado=true;z.textContent='Toca otra vez para confirmar';setTimeout(()=>{armado=false;z.textContent='Empezar de cero · borra el registro'},4000);return}
    if(cuentaSesiones(DB))await respaldar();const ip=DB.inicioProg;DB=sanea({});DB.visto=true;DB.inicioProg=ip;guardar();toast('Registro en cero');pintar()};
  m.appendChild(z);
  m.appendChild(E('p','tip',ALMACEN.nom+'. Si borras Safari o quitas la app, el registro se va con ellos: por eso el respaldo.'));
}
async function compartir(blob,nombre,msg){
  try{const f=new File([blob],nombre,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});toast(msg);return true}}
  catch(e){if(e&&e.name==='AbortError')return false}
  try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast(msg);return true}
  catch(e){toast('No se pudo generar el archivo');return false}
}
async function respaldar(){
  const o=Object.assign({},DB,{programa:PLAN,app:'mosbyfit'});
  const ok=await compartir(new Blob([JSON.stringify(o)],{type:'application/json'}),'mosbyfit-'+HOY+'.json','Respaldo listo: guárdalo en Archivos o mándatelo');
  if(ok){DB.respaldo=HOY;guardar();if(tab!=='hoy'||!(activa()||ojear))pintar()}
}
function elegirArchivo(cb){const i=document.createElement('input');i.type='file';i.accept='application/json,.json,text/plain';
  i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(e){return toast('Ese archivo no es de MosbyFit')}cb(o)};r.readAsText(f)};i.click()}
function cargarArchivo(o){
  if(o&&o.formato==='mosbyfit-programa')return confirmarPrograma(o);
  const d=sanea(o);if(d._futuro)return toast('Ese respaldo es de una versión más nueva de la app');
  const n=cuentaSesiones(d),fs=Object.keys(d.log).sort();
  const trae=o&&o.programa&&validaPlan(o.programa).length===0?o.programa:null;
  if(!n&&!Object.keys(d.medidas).length&&!trae)return toast('Ese archivo no trae nada que cargar');
  abrirHoja('<div class="eyebrow">Respaldo encontrado</div><h2>'+n+(n===1?' sesión':' sesiones')+'</h2><div class="gbody" style="display:block">'+
    (n?'<p>Del <b>'+fs[0]+'</b> al <b>'+fs[fs.length-1]+'</b>.</p>':'')+(trae?'<p>Trae el programa <b>'+trae.nombre+'</b>.</p>':'')+
    '<p><b>Fusionar</b> conserva lo que ya tienes y añade lo que falte.<br><b>Reemplazar</b> borra lo actual y deja solo el respaldo.</p></div>'+
    '<button class="sbtn p" id="imF">Fusionar</button><button class="sbtn d" id="imR">Reemplazar todo</button>');
  const fin=async m=>{if(trae){PLAN=normalizaPlan(trae);try{await ALMACEN.set(KP,JSON.stringify(trae))}catch(e){}}guardar();$('sheet').classList.remove('on');dia=diaDeHoy();pintar();toast(m)};
  $('imF').onclick=()=>{fusionar(DB,d);fin('Respaldo fusionado')};
  $('imR').onclick=()=>{DB=d;DB.visto=true;fin('Registro reemplazado')};
}
function confirmarPrograma(p){
  const err=validaPlan(p);
  if(err.length)return abrirHoja('<div class="eyebrow">No se puede cargar</div><h2>El programa tiene errores</h2><div class="gbody" style="display:block"><p>'+err.slice(0,8).join('<br>')+'</p><p>Pásale este mensaje al chat que lo hizo.</p></div>');
  const ne=p.dias.reduce((a,d)=>a+d.ejercicios.length,0);
  abrirHoja('<div class="eyebrow">Programa nuevo</div><h2>'+(p.nombre||p.id)+'</h2><div class="gbody" style="display:block"><p>'+p.dias.length+' días · '+ne+' ejercicios · inicio '+(p.inicio||'—')+'.</p><p>Tu registro se conserva. Los ejercicios que se llamen igual siguen su historial.</p></div><button class="sbtn p" id="pOk">Cargar programa</button>');
  $('pOk').onclick=async()=>{PLAN=normalizaPlan(p);DB.inicioProg=null;try{await ALMACEN.set(KP,JSON.stringify(p))}catch(e){}guardar();$('sheet').classList.remove('on');dia=diaDeHoy();pintar();toast('Programa cargado')};
}
function calendario(){
  abrirHoja('<div class="eyebrow">Archivo de calendario</div><h2>Tus 5 entrenos</h2><div class="gbody" style="display:block"><p>Las cinco sesiones desde el '+fechaLarga(lunesDe(inicioDe(DB,PLAN)))+', repitiéndose '+PLAN.semanas.length+' semanas, con recordatorio 30 minutos antes. Se abre con el Calendario del iPhone: toca <b>Añadir todos</b>.</p><span class="lbl">¿A qué hora entrenas?</span></div>'+
    '<input class="tini" type="time" id="hEnt" value="'+(PLAN.hora_sugerida||'17:00')+'"><button class="sbtn p" id="gIcs">Generar archivo</button>');
  $('gIcs').onclick=()=>{compartir(new Blob([ics(PLAN,DB,$('hEnt').value||'17:00')],{type:'text/calendar'}),'mosbyfit.ics','Ábrelo y toca Añadir todos');$('sheet').classList.remove('on')};
}

/* ══════════ ARRANQUE ══════════ */
async function cargar(){
  try{const raw=await ALMACEN.get(KP);if(raw){const p=JSON.parse(raw);if(validaPlan(p).length===0)PLAN=normalizaPlan(p)}}catch(e){}
  if(!PLAN)PLAN=normalizaPlan(JSON.parse(JSON.stringify(PLAN_BASE)));
  try{const raw=await ALMACEN.get(K);if(raw)DB=sanea(JSON.parse(raw))}catch(e){toast('No se pudo leer el registro anterior')}
  if(DB._futuro){toast('Registro de una versión más nueva: no se modificó');DB=sanea({})}
  if(ALMACEN.modo==='memoria')dot('err');
  cerrarViejas();
  if(DB.ses&&DB.ses.f===HOY){dia=DB.ses.dia;abierto=DB.ses.ab;restaurar=DB.ses.sc;ojear=true}else dia=activa()?(sesionHoy().dia||diaDeHoy()):diaDeHoy();
  if(activa())dia=sesionHoy().dia||dia;
  pintar();tickReloj();reanudarDescanso();
  if(!DB.visto){DB.visto=true;guardar();ayuda()}
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;restaurar=(tab==='hoy'&&DB.ses&&DB.ses.f===HOY)?DB.ses.sc:null;pintar()});
document.body.addEventListener('touchstart',()=>{despierto();audioOn()},{once:true,passive:true});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
cargar();

</script>
